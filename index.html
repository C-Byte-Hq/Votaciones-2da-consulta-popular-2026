<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Votación Residencial</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
        }

        /* Acceso Administrador en la esquina superior derecha */
        .admin-shortcut {
            position: absolute;
            top: 0;
            right: 0;
            background-color: #475569;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            transition: background 0.2s;
        }
        .admin-shortcut:hover {
            background-color: #334155;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            padding-top: 10px;
        }

        h1, h2, h3 {
            color: var(--primary);
        }

        .card {
            background: var(--card);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 20px;
        }

        .view {
            display: none;
        }
        .view.active {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        select, input, button {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .btn-secondary {
            background-color: #64748b;
        }
        .btn-secondary:hover {
            background-color: #475569;
        }

        /* Ranking Público */
        .ranking-list {
            list-style: none;
            padding: 0;
        }

        .ranking-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            background: #f1f5f9;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .ranking-item:nth-child(1) { background: #fef08a; border-left: 6px solid #eab308; }
        .ranking-item:nth-child(2) { background: #e2e8f0; border-left: 6px solid #94a3b8; }
        .ranking-item:nth-child(3) { background: #ffedd5; border-left: 6px solid #f97316; }

        /* Pestañas Admin */
        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .admin-tab-btn {
            flex: 1;
            padding: 10px;
            background: #e2e8f0;
            color: var(--text);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 0;
        }
        .admin-tab-btn.active {
            background: var(--primary);
            color: white;
        }

        .admin-section {
            display: none;
        }
        .admin-section.active {
            display: block;
        }

        /* Tarjetas de Visualización por Piso */
        .piso-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .piso-header {
            padding: 12px 16px;
            background: #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            cursor: pointer;
        }

        .piso-header:hover {
            background: #cbd5e1;
        }

        .piso-body {
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
        }

        .apto-box {
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .badge-voted {
            background-color: #dcfce7;
            color: #166534;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .badge-pending {
            background-color: #f1f5f9;
            color: #64748b;
            padding: 3px 8px;
            border-radius: 4px;
        }

        .error-msg {
            color: var(--danger);
            font-size: 0.9rem;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Botón de acceso superior -->
    <button class="admin-shortcut" id="btnShortcutAdmin" onclick="mostrarModalLogin()">🔒 Ingresar Admin</button>

    <header>
        <h1>Consulta Popular Residencial</h1>
        <p>Monitoreo de Votación en Vivo</p>
    </header>

    <!-- 1. PANTALLA PÚBLICA (SOLO TOTALES POR EDIFICIO) -->
    <div id="publicView" class="card view active">
        <h2>🏆 Totalización en Vivo por Edificios</h2>
        <p>Resultados acumulados de participación por bloque:</p>
        
        <ul id="rankingList" class="ranking-list" style="margin-top: 20px;">
            <!-- Carga dinámica -->
        </ul>
    </div>

    <!-- 2. LOGIN ADMIN -->
    <div id="loginView" class="card view">
        <h2>Ingreso de Administrador</h2>
        <div class="form-group">
            <label for="adminPass">Contraseña:</label>
            <input type="password" id="adminPass" placeholder="Ingrese contraseña">
            <div id="errorLogin" class="error-msg">Contraseña incorrecta</div>
        </div>
        <button onclick="verificarAdmin()">Acceder</button>
        <button class="btn-secondary" onclick="irPantallaPublica()">Volver a la Pantalla Principal</button>
    </div>

    <!-- 3. ROL ADMINISTRADOR -->
    <div id="adminView" class="card view">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2 style="margin: 0;">Panel de Administración</h2>
            <button class="btn-secondary" onclick="irPantallaPublica()" style="width: auto; margin-top:0;">Salir a Vista Pública</button>
        </div>

        <!-- Pestañas internas -->
        <div class="admin-tabs">
            <button class="admin-tab-btn active" onclick="cambiarTabAdmin('cargar')">Cargar Voto</button>
            <button class="admin-tab-btn" onclick="cambiarTabAdmin('visualizar')">Visualizar por Bloque y Piso</button>
        </div>

        <!-- Pestaña 1: Carga de Votos -->
        <div id="tabCargar" class="admin-section active">
            <div class="form-group">
                <label for="selectBloque">Bloque:</label>
                <select id="selectBloque">
                    <option value="Bloque 8">Bloque 8</option>
                    <option value="Bloque 9">Bloque 9</option>
                    <option value="Bloque 10">Bloque 10</option>
                    <option value="Bloque 11">Bloque 11</option>
                    <option value="Bloque 12">Bloque 12</option>
                </select>
            </div>

            <div class="form-group">
                <label for="selectPiso">Piso:</label>
                <select id="selectPiso">
                    <option value="PB">PB (Planta Baja)</option>
                    <option value="Piso 1">Piso 1</option>
                    <option value="Piso 2">Piso 2</option>
                    <option value="Piso 3">Piso 3</option>
                    <option value="Piso 4">Piso 4</option>
                    <option value="Piso 5">Piso 5</option>
                    <option value="Piso 6">Piso 6</option>
                    <option value="Piso 7">Piso 7</option>
                    <option value="Piso 8">Piso 8</option>
                    <option value="Piso 9">Piso 9</option>
                </select>
            </div>

            <div class="form-group">
                <label for="selectApt">Apartamento:</label>
                <select id="selectApt">
                    <option value="Apt 1">Apartamento 1</option>
                    <option value="Apt 2">Apartamento 2</option>
                    <option value="Apt 3">Apartamento 3</option>
                    <option value="Apt 4">Apartamento 4</option>
                    <option value="Apt 5">Apartamento 5</option>
                    <option value="Apt 6">Apartamento 6</option>
                    <option value="Apt 7">Apartamento 7</option>
                    <option value="Apt 8">Apartamento 8</option>
                </select>
            </div>

            <div class="form-group">
                <label for="cantidadVotos">Cantidad de personas a registrar:</label>
                <input type="number" id="cantidadVotos" value="1" min="1" max="10">
            </div>

            <button onclick="registrarVotoLista()">Sumar Voto(s)</button>
            <p id="mensajeExito" style="color: var(--success); font-weight: bold; margin-top: 10px; display: none;"></p>
        </div>

        <!-- Pestaña 2: Visualización Exclusiva por Bloque y Piso (Solo Mostrar) -->
        <div id="tabVisualizar" class="admin-section">
            <div class="form-group">
                <label for="filtroBloqueAdmin">Seleccione el Bloque a Inspeccionar:</label>
                <select id="filtroBloqueAdmin" onchange="renderizarVisualizacionPisos()">
                    <option value="Bloque 8">Bloque 8</option>
                    <option value="Bloque 9">Bloque 9</option>
                    <option value="Bloque 10">Bloque 10</option>
                    <option value="Bloque 11">Bloque 11</option>
                    <option value="Bloque 12">Bloque 12</option>
                </select>
            </div>

            <div id="contenedorPisosVisualizador" style="margin-top: 20px;">
                <!-- Se genera dinámicamente el desglose por pisos -->
            </div>
        </div>
    </div>
</div>

<script>
    const bloquesLista = ["Bloque 8", "Bloque 9", "Bloque 10", "Bloque 11", "Bloque 12"];
    const pisosLista = ["PB", "Piso 1", "Piso 2", "Piso 3", "Piso 4", "Piso 5", "Piso 6", "Piso 7", "Piso 8", "Piso 9"];
    const aptosLista = ["Apt 1", "Apt 2", "Apt 3", "Apt 4", "Apt 5", "Apt 6", "Apt 7", "Apt 8"];

    let registrosVotos = JSON.parse(localStorage.getItem('registrosVotosContador')) || {};
    const CLAVE_ADMIN = "admin123";

    function cambiarVista(vistaId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(vistaId).classList.add('active');

        const btnShortcut = document.getElementById('btnShortcutAdmin');
        btnShortcut.style.display = (vistaId === 'publicView') ? 'block' : 'none';
    }

    function irPantallaPublica() {
        cambiarVista('publicView');
        actualizarRankingPublico();
    }

    function mostrarModalLogin() {
        document.getElementById('adminPass').value = '';
        document.getElementById('errorLogin').style.display = 'none';
        cambiarVista('loginView');
    }

    function verificarAdmin() {
        const pass = document.getElementById('adminPass').value;
        const errorDiv = document.getElementById('errorLogin');

        if (pass === CLAVE_ADMIN) {
            errorDiv.style.display = 'none';
            cambiarVista('adminView');
            cambiarTabAdmin('cargar');
        } else {
            errorDiv.style.display = 'block';
        }
    }

    function cambiarTabAdmin(tab) {
        document.querySelectorAll('.admin-tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));

        if (tab === 'cargar') {
            document.querySelectorAll('.admin-tab-btn')[0].classList.add('active');
            document.getElementById('tabCargar').classList.add('active');
        } else {
            document.querySelectorAll('.admin-tab-btn')[1].classList.add('active');
            document.getElementById('tabVisualizar').classList.add('active');
            renderizarVisualizacionPisos();
        }
    }

    function registrarVotoLista() {
        const bloque = document.getElementById('selectBloque').value;
        const piso = document.getElementById('selectPiso').value;
        const apt = document.getElementById('selectApt').value;
        const cantidadInput = parseInt(document.getElementById('cantidadVotos').value) || 1;

        const key = `${bloque}_${piso}_${apt}`;

        if (!registrosVotos[key]) {
            registrosVotos[key] = 0;
        }
        registrosVotos[key] += cantidadInput;

        localStorage.setItem('registrosVotosContador', JSON.stringify(registrosVotos));

        const msgExito = document.getElementById('mensajeExito');
        msgExito.innerText = `¡Registrado(s) ${cantidadInput} voto(s) para ${apt} (${piso}, ${bloque})! Total: ${registrosVotos[key]}`;
        msgExito.style.display = 'block';
        
        setTimeout(() => { msgExito.style.display = 'none'; }, 3000);
    }

    function calcularTotalesBloques() {
        let totales = {};
        bloquesLista.forEach(b => totales[b] = 0);

        for (let key in registrosVotos) {
            const numVotos = registrosVotos[key] || 0;
            const bloque = key.split('_')[0];
            if (totales[bloque] !== undefined) {
                totales[bloque] += numVotos;
            }
        }
        return totales;
    }

    function actualizarRankingPublico() {
        const lista = document.getElementById('rankingList');
        lista.innerHTML = '';

        const totales = calcularTotalesBloques();
        const bloquesOrdenados = Object.entries(totales).sort((a, b) => b[1] - a[1]);

        bloquesOrdenados.forEach(([bloque, totalVotos], index) => {
            const li = document.createElement('li');
            li.className = 'ranking-item';
            li.innerHTML = `<span>#${index + 1} - ${bloque}</span> <span>${totalVotos} voto(s)</span>`;
            lista.appendChild(li);
        });
    }

    // Renderizado exclusivo para mostrar desglose por piso y apartamento
    function renderizarVisualizacionPisos() {
        const bloqueSeleccionado = document.getElementById('filtroBloqueAdmin').value;
        const contenedor = document.getElementById('contenedorPisosVisualizador');
        contenedor.innerHTML = '';

        pisosLista.forEach(piso => {
            let totalVotosPiso = 0;
            let aptosHtml = '';

            aptosLista.forEach(apt => {
                const key = `${bloqueSeleccionado}_${piso}_${apt}`;
                const votosApto = registrosVotos[key] || 0;
                totalVotosPiso += votosApto;

                aptosHtml += `
                    <div class="apto-box">
                        <span>${apt}</span>
                        <span class="${votosApto > 0 ? 'badge-voted' : 'badge-pending'}">${votosApto} votos</span>
                    </div>
                `;
            });

            const pisoCard = document.createElement('div');
            pisoCard.className = 'piso-card';
            pisoCard.innerHTML = `
                <div class="piso-header">
                    <span>🏢 ${piso}</span>
                    <span>Total Piso: ${totalVotosPiso} voto(s)</span>
                </div>
                <div class="piso-body">
                    ${aptosHtml}
                </div>
            `;
            contenedor.appendChild(pisoCard);
        });
    }

    // Inicialización al abrir la página
    actualizarRankingPublico();

    // Actualización automática cada 2 segundos
    setInterval(() => {
        if (document.getElementById('publicView').classList.contains('active')) {
            registrosVotos = JSON.parse(localStorage.getItem('registrosVotosContador')) || registrosVotos;
            actualizarRankingPublico();
        }
    }, 2000);
</script>

</body>
</html>
